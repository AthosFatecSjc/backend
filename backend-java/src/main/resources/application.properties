# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/energia_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:energia_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=energia

# MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://admin:admin123@mongodb:27017/energia_analytics?authSource=admin}

# Server
server.port=${SERVER_PORT:8181}

# DB Migrations - Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=energia,aneel
spring.flyway.default-schema=energia
spring.flyway.user=${FLYWAY_USER:energia_user}
spring.flyway.password=${FLYWAY_PASSWORD:energia123}

# Privacy Configuration
privacy.reconciliation.enabled=${PRIVACY_RECONCILIATION_ENABLED:true}
privacy.backup.retention-days=${PRIVACY_BACKUP_RETENTION_DAYS:90}

# JWT Configuration
jwt.secret=${JWT_SECRET:sua-chave-secreta-muito-longa-com-pelo-menos-256-bits-de-comprimento-para-hs512}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Logging
logging.level.root=INFO
logging.level.com.energia.backend=DEBUG

# Admin Bootstrap
admin.email=${ADMIN_EMAIL:#{null}}
admin.password=${ADMIN_PASSWORD:#{null}}
