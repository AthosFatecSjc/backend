version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: energia-postgres
    environment:
      POSTGRES_DB: energia_db
      POSTGRES_USER: energia_user
      POSTGRES_PASSWORD: energia123 
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
    networks:
      - energia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energia_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6-jammy
    container_name: energia-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: energia_analytics
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./init-scripts/mongo:/docker-entrypoint-initdb.d
    networks:
      - energia-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/energia_analytics --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: energia-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    networks:
      - energia-network
    depends_on:
      - postgres

  mongo-express:
    image: mongo-express:latest
    container_name: energia-mongo-express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8081:8081"
    networks:
      - energia-network
    depends_on:
      - mongodb

volumes:
  postgres_data:
  mongodb_data:

networks:
  energia-network:
    driver: bridge