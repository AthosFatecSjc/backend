services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: energia-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT_LOCAL}:5432"
    volumes:
      # - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
    networks:
      - energia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6-jammy
    container_name: energia-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "${MONGO_PORT_LOCAL}:27017"
    volumes:
      # - mongodb_data:/data/db
      - ./init-scripts/mongo:/docker-entrypoint-initdb.d
    networks:
      - energia-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/${MONGO_DATABASE} --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend-java:
    build:
      context: ./backend-java
    container_name: energia-backend-java
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DATABASE}?authSource=${MONGO_AUTH_SOURCE}
      SERVER_PORT: ${SERVER_PORT_JAVA}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ETL_FILE_DIST_PATH: ${ETL_FILE_DIST_CONTAINER_PATH}
    ports:
      - "${SERVER_PORT_JAVA}:8181"
    networks:
      - energia-network
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -X POST http://localhost:8181/auth/login -H 'Content-Type: application/json' -d '{\"email\":\"invalid@example.com\",\"senha\":\"invalid\"}' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - ${ETL_FILE_DIST_PATH}:${ETL_FILE_DIST_CONTAINER_PATH}
   
  backend-python:
    build:
      context: ./backend-python
    container_name: energia-backend-python
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PORT: ${SERVER_PORT_PYTHON}
      ANEEL_PERDAS_REPORT_URL: ${ANEEL_PERDAS_REPORT_URL}
      ANEEL_PERDAS_PAGE_INDEX: ${ANEEL_PERDAS_PAGE_INDEX}
      ANEEL_PERDAS_PAGE_NAME: ${ANEEL_PERDAS_PAGE_NAME}
      ANEEL_PERDAS_VISUAL_TITLE: ${ANEEL_PERDAS_VISUAL_TITLE}
      ANEEL_PERDAS_EXPORT_MODE: ${ANEEL_PERDAS_EXPORT_MODE}
      ANEEL_PERDAS_MAX_ROWS: ${ANEEL_PERDAS_MAX_ROWS}
      ANEEL_PERDAS_TIMEOUT_MS: ${ANEEL_PERDAS_TIMEOUT_MS}
      ANEEL_PERDAS_RETENTION_YEARS: ${ANEEL_PERDAS_RETENTION_YEARS}
      ANEEL_PERDAS_HEADLESS: ${ANEEL_PERDAS_HEADLESS}
      ANEEL_PERDAS_ARCHIVE_DIR: ${ANEEL_PERDAS_ARCHIVE_DIR}
    ports:
      - "${SERVER_PORT_PYTHON}:8000"
    networks:
      - energia-network
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  backend-python-cron:
    build:
      context: ./backend-python
    container_name: energia-backend-python-cron
    command: ["/usr/local/bin/start-cron.sh"]
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE}
      ANEEL_PERDAS_REPORT_URL: ${ANEEL_PERDAS_REPORT_URL}
      ANEEL_PERDAS_PAGE_INDEX: ${ANEEL_PERDAS_PAGE_INDEX}
      ANEEL_PERDAS_PAGE_NAME: ${ANEEL_PERDAS_PAGE_NAME}
      ANEEL_PERDAS_VISUAL_TITLE: ${ANEEL_PERDAS_VISUAL_TITLE}
      ANEEL_PERDAS_EXPORT_MODE: ${ANEEL_PERDAS_EXPORT_MODE}
      ANEEL_PERDAS_MAX_ROWS: ${ANEEL_PERDAS_MAX_ROWS}
      ANEEL_PERDAS_TIMEOUT_MS: ${ANEEL_PERDAS_TIMEOUT_MS}
      ANEEL_PERDAS_RETENTION_YEARS: ${ANEEL_PERDAS_RETENTION_YEARS}
      ANEEL_PERDAS_HEADLESS: ${ANEEL_PERDAS_HEADLESS}
      ANEEL_PERDAS_ARCHIVE_DIR: ${ANEEL_PERDAS_ARCHIVE_DIR}
    networks:
      - energia-network
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    container_name: energia-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8080:80"
    networks:
      - energia-network
    depends_on:
      - postgres
 
  mongo-express:
    image: mongo-express:latest
    container_name: energia-mongo-express
    profiles: ["tools"]
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
    ports:
      - "8081:8081"
    networks:
      - energia-network
    depends_on:
        mongodb:
          condition: service_healthy

# volumes:
#   postgres_data:
#   mongodb_data:

networks:
  energia-network:
    driver: bridge
